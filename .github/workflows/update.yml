# Fetches the latest AGSI+ storage, ALSI LNG, TTF and Eurostat demand data, commits them, and republishes the site.
#
# Started by cron-job.org (a POST to this workflow's "dispatches" API, see README), by the
# "Run workflow" button in the Actions tab, or by pushing a change to .github/update-now.txt
# (daily update) or .github/refetch-all.txt (everything again from fetch_from).
# GitHub's own schedule isn't used: it only runs for the person who last edited the cron line.
name: Update storage data and deploy

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch everything again from fetch_from (first run, or after changing config.json)"
        type: boolean
        default: false
  push:
    branches: [main]           # a code or config change redeploys; update-now.txt also fetches

permissions:
  contents: write              # commit the updated data
  pages: write                 # deploy to GitHub Pages
  id-token: write

concurrency:
  group: storage-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2       # lets the push check below see which files changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to fetch
        id: what
        run: |
          fetch=false; full=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then fetch=true; fi
          if [ "${{ inputs.full }}" = "true" ]; then full=true; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            if echo "$changed" | grep -qE '^(\.github/update-now\.txt|config\.json)$'; then fetch=true; fi
            if echo "$changed" | grep -qE '^\.github/refetch-all\.txt$'; then fetch=true; full=true; fi
          fi
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Fetch AGSI+ storage and ALSI LNG
        if: steps.what.outputs.fetch == 'true'
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ steps.what.outputs.full }}" = "true" ]; then python scripts/fetch_gie.py --full; else python scripts/fetch_gie.py; fi

      - name: Fetch TTF
        if: steps.what.outputs.fetch == 'true'
        continue-on-error: true
        run: python scripts/fetch_ttf.py

      - name: Fetch Eurostat gas demand
        if: steps.what.outputs.fetch == 'true'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_demand.py

      - name: Commit updated data
        if: steps.what.outputs.fetch == 'true'
        run: |
          if [ -z "$(git status --porcelain site/data)" ]; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Data updated $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
